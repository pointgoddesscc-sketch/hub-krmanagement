<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KR Management Team Meet & Greet Inquiries</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dark-theme">
    <header>
        <!-- Placeholder for header, same as index.html -->
        <nav>
            <a href="index.html">Home</a>
            <!-- Add other navigation links as needed -->
        </nav>
        <h1>KR Management Team</h1>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Meet & Greet and Inquiry Form</h2>
            <p>Please fill out the form below to submit your inquiry. We will get back to you as soon as possible.</p>
            <form data-form="meet-greet">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" name="phone">
                </div>
                <div class="form-group">
                    <label for="country">Country:</label>
                    <input type="text" id="country" name="country">
                </div>
                <div class="form-group">
                    <label for="inquiryType">Inquiry Type:</label>
                    <select id="inquiryType" name="inquiryType" required>
                        <option value="">Select an option</option>
                        <option value="Meet & Greet">Meet & Greet</option>
                        <option value="VIP Experience">VIP Experience</option>
                        <option value="Private Appearance">Private Appearance</option>
                        <option value="Booking">Booking</option>
                        <option value="Fan Opportunity">Fan Opportunity</option>
                        <option value="General Management Inquiry">General Management Inquiry</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="preferredDate">Preferred Date (if applicable):</label>
                    <input type="date" id="preferredDate" name="preferredDate">
                </div>
                <div class="form-group">
                    <label for="guests">Number of Guests (if applicable):</label>
                    <input type="number" id="guests" name="guests" min="1">
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="consent" name="consent" required>
                    <label for="consent">I consent to my data being processed for the purpose of this inquiry.</label>
                </div>
                <button type="submit" class="submit-button">Submit Inquiry</button>
            </form>
        </section>
    </main>

    <footer>
        <!-- Placeholder for footer, same as index.html -->
        <p>&copy; 2023 KR Management Team. All rights reserved.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
